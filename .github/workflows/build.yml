name: Build Azure Func
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - run: az bicep build --file .infra/main.bicep --outfile /tmp/main.json
      - run: az bicep build --file .infra/apim/main.bicep --outfile /tmp/apim.json
      - run: bash -n .infra/scripts/*.sh
      - run: dotnet restore Internal.ExchangeRates.slnx
      - run: dotnet build Internal.ExchangeRates.slnx --no-restore -c Release
      - run: dotnet test Internal.ExchangeRates.slnx --no-build --no-restore -c Release
