name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: Test
        options: [Test, Prod]
      version:
        description: Artifact version, for example v1.2.3
        required: true
        type: string
      skip_deploy:
        description: Skip Function App deployment
        type: boolean
        default: false
      skip_apim:
        description: Skip API Management placeholder
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-application:
    if: ${{ !inputs.skip_deploy }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download from Azure Blob Storage
        run: |
          mkdir -p ./publish
          az storage blob download \
            --name "${{ vars.AZURE_ARTIFACT_NAME }}-${{ inputs.version }}.zip" \
            --file "./publish/${{ vars.AZURE_ARTIFACT_NAME }}-${{ inputs.version }}.zip" \
            --account-name "${{ vars.AZURE_ARTIFACT_ACCOUNT_NAME }}" \
            --container-name "${{ vars.AZURE_ARTIFACT_CONTAINER_NAME }}" \
            --account-key "${{ secrets.AZURE_ACCOUNT_KEY_ARTIFACT }}" \
            --only-show-errors
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.DEPLOY_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: func-${{ vars.AZURE_NAME_ROOT }}-${{ vars.AZURE_NAME_POSTFIX }}
          package: ./publish/${{ vars.AZURE_ARTIFACT_NAME }}-${{ inputs.version }}.zip
          sku: flexconsumption
          remote-build: false
      - name: Set Function App Settings
        uses: azure/cli@v3
        env:
          AZURE_RESOURCE_GROUP_NAME: rg-${{ vars.AZURE_NAME_ROOT }}-${{ vars.AZURE_NAME_POSTFIX }}
          AZURE_FUNCTION_NAME: func-${{ vars.AZURE_NAME_ROOT }}-${{ vars.AZURE_NAME_POSTFIX }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
          DATAVERSE_SERVICE_URL: ${{ vars.DATAVERSE_SERVICE_URL }}
          EXCHANGE_RATE_CURRENCY_PAIRS: ${{ vars.EXCHANGE_RATE_CURRENCY_PAIRS }}
          CURRENT_RATE_UPDATE_SCHEDULE: ${{ vars.CURRENT_RATE_UPDATE_SCHEDULE }}
          DAILY_RATE_UPDATE_SCHEDULE: ${{ vars.DAILY_RATE_UPDATE_SCHEDULE }}
        with:
          inlineScript: bash ./.infra/scripts/set-function-app-settings.sh
      - name: Azure Logout
        if: ${{ always() }}
        uses: azure/cli@v3
        with:
          inlineScript: az logout

  deploy-apim-placeholder:
    if: ${{ !inputs.skip_apim }}
    needs: deploy-application
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.DEPLOY_SUBSCRIPTION_ID }}
      - name: Verify APIM placeholder
        uses: azure/cli@v3
        env:
          APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
          APIM_SERVICE_NAME: ${{ vars.APIM_SERVICE_NAME }}
        with:
          inlineScript: bash ./.infra/scripts/prepare-apim.sh
      - name: Azure Logout
        if: ${{ always() }}
        uses: azure/cli@v3
        with:
          inlineScript: az logout
